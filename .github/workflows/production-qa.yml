name: Production QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: Site origin to test
        required: true
        default: https://conversiontype.com
        type: string
      expected_commit:
        description: Expected deployed commit SHA for the report
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-qa
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build pull request candidate
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Configure QA target
        env:
          DISPATCH_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "QA_BASE_URL=http://127.0.0.1:4173" >> "${GITHUB_ENV}"
            python3 -m http.server 4173 --directory dist > /tmp/conversiontype-qa-server.log 2>&1 &
            for attempt in 1 2 3 4 5; do
              curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
              sleep 1
            done
            cat /tmp/conversiontype-qa-server.log
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "QA_BASE_URL=https://conversiontype.com" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "QA_BASE_URL=${DISPATCH_BASE_URL}" >> "${GITHUB_ENV}"
      - name: Install QA runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run guarded production QA
        run: npx playwright test --config qa/playwright.config.mjs
      - name: Write run metadata
        if: always()
        run: |
          mkdir -p qa-artifacts
          printf '%s\n' "base_url=${QA_BASE_URL}" "expected_commit=${QA_EXPECTED_COMMIT}" "repository_commit=${GITHUB_SHA}" "run_id=${GITHUB_RUN_ID}" > qa-artifacts/run-metadata.txt
          cp qa/qa-results.json qa-artifacts/ 2>/dev/null || true
          cp -R qa/playwright-report qa-artifacts/ 2>/dev/null || true
          cp -R qa/test-results qa-artifacts/ 2>/dev/null || true
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversiontype-production-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
