name: Production QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site origin to test
        required: true
        default: https://conversiontype.pages.dev
        type: string
      expected_commit:
        description: Expected deployed commit SHA for the report
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-qa
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_BASE_URL: ${{ inputs.base_url }}
      QA_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install QA runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run guarded production QA
        run: npx playwright test --config qa/playwright.config.mjs
      - name: Write run metadata
        if: always()
        run: |
          mkdir -p qa-artifacts
          printf '%s\n' "base_url=${QA_BASE_URL}" "expected_commit=${QA_EXPECTED_COMMIT}" "repository_commit=${GITHUB_SHA}" "run_id=${GITHUB_RUN_ID}" > qa-artifacts/run-metadata.txt
          cp qa/qa-results.json qa-artifacts/ 2>/dev/null || true
          cp -R qa/playwright-report qa-artifacts/ 2>/dev/null || true
          cp -R qa/test-results qa-artifacts/ 2>/dev/null || true
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversiontype-production-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 14
